<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览独立设计师的个人作品集网站截图，点击访问原站。">
  <meta name="theme-color" content="#ffffff">
  <title>精选最佳设计师的个人网站</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="精选最佳设计师的个人网站">
  <meta property="og:description" content="浏览独立设计师的个人作品集网站截图，点击访问原站。">
  <meta property="og:image" content="./share-cover.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="600">
  <meta property="og:image:alt" content="深色模式下的网站首页，展示三列设计师作品集预览。">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="精选最佳设计师的个人网站">
  <meta name="twitter:description" content="浏览独立设计师的个人作品集网站截图，点击访问原站。">
  <meta name="twitter:image" content="./share-cover.jpg">
  <meta name="twitter:image:alt" content="深色模式下的网站首页，展示三列设计师作品集预览。">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./sites.js"></script>
  <script defer src="./gallery.js"></script>
  <script defer src="./submit-site.js"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="site-brand">
        <img class="mark" src="./icon.svg" width="34" height="34" alt="">
        <h1>精选最佳设计师的个人网站</h1>
      </div>
      <div class="header-actions">
        <div class="theme-switch" role="group" aria-label="页面配色" hidden>
          <label class="theme-option" title="浅色模式">
            <input class="visually-hidden" type="radio" name="theme" value="light" aria-label="浅色模式">
            <span class="theme-option-icon">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/>
              </svg>
            </span>
          </label>
          <label class="theme-option" title="深色模式">
            <input class="visually-hidden" type="radio" name="theme" value="dark" aria-label="深色模式">
            <span class="theme-option-icon">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.5 14.3A8.8 8.8 0 0 1 9.7 3.5a8.8 8.8 0 1 0 10.8 10.8Z"/>
              </svg>
            </span>
          </label>
        </div>
        <button class="action-button" id="open-submit-site" type="button" aria-haspopup="dialog" aria-controls="submit-site-dialog" hidden>提交网站</button>
        <a class="action-button social-button" href="https://x.com/faaaannng" target="_blank" rel="noopener noreferrer" aria-label="前往 X 主页（在新标签页打开）" title="前往 X 主页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <symbol id="x-logo" viewBox="0 0 24 24">
              <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.585-6.64 7.585H.471l8.6-9.835L0 1.154h7.594l5.243 6.932zM17.61 20.644h2.039L6.488 3.24H4.3z"/>
            </symbol>
            <use href="#x-logo"/>
          </svg>
        </a>
      </div>
    </header>

    <main>
      <ul class="gallery" id="gallery" aria-label="设计师个人作品集" role="list"></ul>
      <noscript><p>请启用 JavaScript 以浏览作品集。</p></noscript>
    </main>

    <footer class="site-footer">
      <p>如需移除作品或隐私内容，请<a href="https://x.com/faaaannng" target="_blank" rel="noopener noreferrer">在 X 上私信我</a>。</p>
    </footer>
  </div>

  <dialog class="submit-dialog" id="submit-site-dialog" aria-labelledby="submit-site-title" aria-describedby="submit-site-description">
    <div class="submit-dialog-content">
      <form method="dialog">
        <button class="dialog-close" type="submit" aria-label="关闭弹窗" autofocus>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </form>
      <h2 id="submit-site-title">提交网站</h2>
      <p id="submit-site-description">有想推荐的设计师网站？在 X（推特）上私信我，把网站链接发给我，我来上架。</p>
      <a class="action-button" href="https://x.com/faaaannng" target="_blank" rel="noopener noreferrer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <use href="#x-logo"/>
        </svg>
        前往 X 主页
      </a>
    </div>
  </dialog>

  <template id="card-template">
    <li>
      <a class="card" target="_blank" rel="noopener noreferrer">
        <span class="frame">
          <span class="preview">
            <img class="preview-image" width="1440" height="810" alt="" decoding="async">
            <span class="preview-status" aria-hidden="true" hidden>图片暂不可用</span>
          </span>
        </span>
        <span class="title"></span>
        <span class="visually-hidden">（在新标签页打开）</span>
      </a>
    </li>
  </template>
</body>
</html>
